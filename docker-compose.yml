services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: msvc-transactions-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - msvc-transactions-net

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: msvc-transactions-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_HOST: sqlserver
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_DATABASE: ${MSSQL_DATABASE:-msvc_transactions}
      MSSQL_APP_USER: ${SPRING_DATASOURCE_USERNAME}
      MSSQL_APP_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    volumes:
      - ./docker/sqlserver/init-db.sh:/scripts/init-db.sh:ro
      - ./src/main/resources/schema.sql:/scripts/schema.sql:ro
      - ./src/main/resources/data.sql:/scripts/data.sql:ro
      - ./src/main/resources/sp_estado_cuenta.sql:/scripts/sp_estado_cuenta.sql:ro
    entrypoint: ["/bin/bash", "/scripts/init-db.sh"]
    restart: "no"
    networks:
      - msvc-transactions-net

  wiremock:
    image: wiremock/wiremock:3.9.1
    container_name: msvc-transactions-wiremock
    ports:
      - "${WIREMOCK_PORT:-8089}:8080"
    volumes:
      - ./docker/wiremock/mappings:/home/wiremock/mappings:ro
    command: ["--global-response-templating", "--verbose"]
    networks:
      - msvc-transactions-net

  app:
    build: .
    image: msvc-transactions:local
    container_name: msvc-transactions-app
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:sqlserver://sqlserver:1433;databaseName=${MSSQL_DATABASE:-msvc_transactions};encrypt=true;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      VALIDATION_STUB_ENABLED: ${VALIDATION_STUB_ENABLED:-true}
      VALIDATION_SERVICE_URL: ${VALIDATION_SERVICE_URL:-http://localhost:8080/external}
      VALIDATION_CONNECT_TIMEOUT: ${VALIDATION_CONNECT_TIMEOUT:-2s}
      VALIDATION_READ_TIMEOUT: ${VALIDATION_READ_TIMEOUT:-2s}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - msvc-transactions-net

volumes:
  sqlserver_data:

networks:
  msvc-transactions-net:
    name: msvc-transactions-net
