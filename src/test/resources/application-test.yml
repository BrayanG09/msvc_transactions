spring:
  datasource:
    url: jdbc:h2:mem:msvc_transactions;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never

validation:
  stub:
    enabled: false
  service:
    url: http://localhost:9
    connect-timeout: 1s
    read-timeout: 1s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    root: WARN
    hn.infatlan.msvc_transactions: WARN
