spring:
  application:
    name: msvc-transactions
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=msvc_transactions;encrypt=true;trustServerCertificate=true}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true
    show-sql: false
  sql:
    init:
      mode: never

server:
  port: ${SERVER_PORT:8080}

validation:
  stub:
    enabled: ${VALIDATION_STUB_ENABLED:true}
  service:
    url: ${VALIDATION_SERVICE_URL:http://localhost:8080/external}
    connect-timeout: ${VALIDATION_CONNECT_TIMEOUT:2s}
    read-timeout: ${VALIDATION_READ_TIMEOUT:2s}

resilience4j:
  circuitbreaker:
    instances:
      validationService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        slowCallRateThreshold: 100
        slowCallDurationThreshold: 2s
  retry:
    instances:
      validationService:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException
          - java.io.IOException
          - java.util.concurrent.TimeoutException

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
    displayRequestDuration: true

logging:
  level:
    root: INFO
    hn.infatlan.msvc_transactions: INFO
    io.github.resilience4j: INFO
